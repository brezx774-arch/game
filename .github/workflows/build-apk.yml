name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install
      - name: Build Web App
        env:
          VITE_SERVER_URL: ${{ secrets.LIVE_SERVER_URL }}
        run: npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android
      - name: Add Android Platform
        run: npx cap add android
      - name: Enable Google Sign-In native dependency
        run: |
          sed -i "/cordovaAndroidVersion = '14.0.1'/a\\    rgcfaIncludeGoogle = true\\n    androidxCredentialsVersion = '1.3.0'" android/variables.gradle
      - name: Add google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | tr -d '\n' | base64 -d > android/app/google-services.json
      - name: Add Google Services Gradle Plugin
        run: |
          sed -i '/dependencies {/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Install Stable Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | tr -d '\n' | base64 -d > ~/.android/debug.keystore
      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          npx @capacitor/assets generate --iconBackgroundColor '#000000' --assetPath public
      - name: Sync Android
        run: npx cap sync android
      - name: Debug - Check Web Client ID
        working-directory: ./android
        run: |
          ./gradlew :app:processDebugGoogleServices
          echo "=== default_web_client_id ==="
          grep -R "default_web_client_id" app/build/generated/ -A2 || echo "NOT FOUND"
      - name: Verify Java Version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
      - name: Build APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SixAppealCricket-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
