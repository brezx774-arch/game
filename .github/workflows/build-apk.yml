name: Build Android APK

on:
  workflow_dispatch: # Allows you to trigger the APK build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Web App
        # Injects your live VPS URL so the Android app knows where to connect
        env:
          VITE_SERVER_URL: ${{ secrets.LIVE_SERVER_URL }}
        run: npm run build
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android
        
      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android
          
      - name: Build APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SixAppealCricket-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
