name: Build Android APK
on:
  workflow_dispatch: # Allows you to trigger the APK build manually from the Actions tab
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install
      - name: Build Web App
        # Injects your live VPS URL so the Android app knows where to connect
        env:
          VITE_SERVER_URL: ${{ secrets.LIVE_SERVER_URL }}
        run: npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android
      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping."
          fi
      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          npx @capacitor/assets generate --iconBackgroundColor '#000000' --assetPath public
      - name: Sync Android
        run: |
          npx cap sync android
          
      - name: Configure Firebase and Google Sign-In
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          # 1. Enable Google Sign-In in variables.gradle
          echo "" >> android/variables.gradle
          grep -q "rgcfaIncludeGoogle" android/variables.gradle || echo "ext.rgcfaIncludeGoogle = true" >> android/variables.gradle
          grep -q "rgcfaIncludeFacebook" android/variables.gradle || echo "ext.rgcfaIncludeFacebook = true" >> android/variables.gradle
          
          # 2. Inject google-services.json
          mkdir -p android/app
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is empty or missing!"
            exit 1
          fi
          # Ensure strict decoding (ignore garbage but don't silently fail if heavily corrupted)
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          
          echo "Verifying google-services.json..."
          if ! grep -q '"client_type": 3' android/app/google-services.json; then
             echo "::error::CRITICAL: Your google-services.json is missing the Web Client ID (client_type: 3)."
             exit 1
          fi
          echo "========================================================"
          echo "🔍 FIREBASE PROJECT CHECK 🔍"
          echo "Ensure this Project ID matches the one you are editing in Firebase!"
          grep '"project_id"' android/app/google-services.json | head -n 1
          echo "========================================================"
          
          # 3. Inject Keystore
          mkdir -p ~/.android
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is empty or missing!"
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          
          echo "Verifying debug.keystore validity and extracting Fingerprints..."
          if ! keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null; then
             echo "::error::CRITICAL: Your debug.keystore is corrupted! The Base64 string in GitHub Secrets is invalid. Please regenerate the base64 string from your VPS and update the Secret."
             exit 1
          fi
          
          echo "========================================================"
          echo "🔑 GITHUB ACTIONS KEYSTORE FINGERPRINTS 🔑"
          echo "If Google Sign-In gives Error 10, add these exact"
          echo "fingerprints to your Firebase Android App settings!"
          echo "========================================================"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA1:|SHA256:"
          echo "========================================================"
      - name: Verify Java Version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          # Create a dummy folder with settings.gradle to generate the wrapper jar safely
          mkdir -p ../temp-wrapper
          touch ../temp-wrapper/settings.gradle
          (cd ../temp-wrapper && gradle wrapper --gradle-version 8.14.3 && cp gradle/wrapper/gradle-wrapper.jar ../android/gradle/wrapper/gradle-wrapper.jar)
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SixAppealCricket-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
