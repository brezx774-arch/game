name: Fully Automatic OTA Deployment

on:
  push:
    branches:
      - main # Change this to master if your default branch is master

jobs:
  deploy-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Execute OTA Update on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Navigate to your app directory
            cd /var/www/game
            
            # 2. Pull the latest changes from GitHub
            git pull origin main
            
            # 3. Install dependencies and build the new web bundle
            npm install
            npm run build
            
            # 4. Generate a unique version number using the latest Git commit hash
            VERSION=$(git rev-parse --short HEAD)
            
            # 5. Make sure the updates folder exists
            mkdir -p updates
            
            # 6. Zip the new build and place it in the updates folder
            cd dist
            zip -r ../updates/update_$VERSION.zip *
            cd ..
            
            # 7. Update the .env file with the new version and URL
            sed -i "s|^APP_VERSION=.*|APP_VERSION=$VERSION|" .env
            sed -i "s|^APP_UPDATE_URL=.*|APP_UPDATE_URL=https://amongush.duckdns.org/updates/update_$VERSION.zip|" .env
            
            # 8. Restart your Node server to apply the .env changes
            # (Assuming you use pm2 to run your server. Change 'server' to your pm2 process name if different)
            pm2 restart all
