name: Deploy to VPS

on:
  push:
    branches: [ "main" ] # Triggers when you push to the main branch
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment on VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to your project folder (update this path to match your VPS)
            cd /var/www/game
            
            # Pull latest changes from GitHub
            git pull origin main
            
            # Install dependencies and build
            npm install
            npm run build
            
            # Restart the PM2 process (update 'cricket' to your actual PM2 process name)
            pm2 restart cricket-server
