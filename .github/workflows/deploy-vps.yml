name: Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment on VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/game

            git pull origin main

            npm install
            npm run build

            VERSION=$(git rev-parse --short HEAD)

            cd dist
            zip -r ../update_${VERSION}.zip *
            cd ..
            cp update_${VERSION}.zip /var/www/html/updates/

            sed -i \
              -e "s/APP_VERSION=.*/APP_VERSION=${VERSION}/" \
              -e "s|APP_UPDATE_URL=.*|APP_UPDATE_URL=https://amongush.duckdns.org/updates/update_${VERSION}.zip|" \
              .env

            /root/.nvm/versions/node/v24.18.1/bin/pm2 restart cricket-server

            echo "Deployed version ${VERSION}"
